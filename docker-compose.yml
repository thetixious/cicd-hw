x-airflow-common:
  &airflow-common
  build: .
  image: cicd-hw-airflow:2.7.1
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW_CONN_SPARK_LOCAL: spark://spark%3A%2F%2Fspark-master:7077
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/reports:/opt/airflow/reports
    - ${AIRFLOW_PROJ_DIR:-.}/spark:/opt/airflow/spark
    - ${AIRFLOW_PROJ_DIR:-.}/spark-events:/opt/airflow/spark-events
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

x-airflow-common-depends-on:
  &airflow-common-depends-on
  postgres:
    condition: service_healthy
  spark-worker:
    condition: service_started

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  spark-master:
    container_name: spark-master
    image: apache/spark:3.5.0
    environment:
      SPARK_MASTER_OPTS: "-Dspark.metrics.conf=/opt/spark/conf/metrics.properties"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4040:8080"
      - "7077:7077"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    command: "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    restart: always

  spark-worker:
    container_name: spark-worker
    image: apache/spark:3.5.0
    environment:
      SPARK_WORKER_OPTS: "-Dspark.metrics.conf=/opt/spark/conf/metrics.properties"
    depends_on:
      spark-master:
        condition: service_started
    ports:
      - "7001:8081"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    command: "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    restart: always

  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: always

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    depends_on:
      - loki
    ports:
      - "12345:12345"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow-logs:ro
      - ${AIRFLOW_PROJ_DIR:-.}/spark-events:/opt/spark-events:ro
      - ${AIRFLOW_PROJ_DIR:-.}/alloy.conf:/etc/alloy/config.alloy:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    restart: always

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    depends_on:
      - loki
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${AIRFLOW_PROJ_DIR:-.}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/reports
        mkdir -p /sources/spark-events
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/logs /sources/reports /sources/spark-events
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources
    depends_on:
      <<: *airflow-common-depends-on

volumes:
  postgres-db-volume:
